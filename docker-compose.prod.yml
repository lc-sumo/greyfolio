# Self-hosted alternative to render.yaml: app + Postgres + nightly backups on one box.
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: greystone
      POSTGRES_USER: greystone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greystone -d greystone"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      SEED: ${SEED:-none}
      DATABASE_URL: postgres://greystone:${POSTGRES_PASSWORD}@db:5432/greystone
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ chars)}
      BASE_URL: ${BASE_URL:?set BASE_URL, e.g. https://portal.greystoneus.com}
      APP_ORIGIN: ${APP_ORIGIN:-${BASE_URL}}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-on}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-off}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Greystone Commission Portal <portal@greystoneus.com>}
      RENEWAL_DIGEST_HOUR_UTC: ${RENEWAL_DIGEST_HOUR_UTC:-13}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Nightly pg_dump into ./backups, 30 days kept. Copy that folder off the box (rclone, S3 sync, a cron on another machine).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: greystone
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: greystone
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh", "loop"]

volumes:
  pgdata:
